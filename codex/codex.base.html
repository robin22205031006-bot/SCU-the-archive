<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCU Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDEFF6;--panel:#FFFFFF;--panel2:#F3F5FB;--ink:#161923;--muted:#5A6378;--line:#C9D0E2;--glow:.3;--c1:#B79CFF;--c2:#EADFFF;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#090B11;--panel:#11141D;--panel2:#171B27;--ink:#EAF0FF;--muted:#98A2BC;--line:#262C3E;--glow:.9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#090B11;--panel:#11141D;--panel2:#171B27;--ink:#EAF0FF;--muted:#98A2BC;--line:#262C3E;--glow:.9;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:70px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;background:radial-gradient(130% 55% at 50% -8%,color-mix(in srgb,var(--c1) 24%,transparent),transparent 62%),radial-gradient(60% 40% at 100% 100%,color-mix(in srgb,var(--c2) 10%,transparent),transparent 70%),var(--bg);background-attachment:fixed;transition:background 300ms}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none !important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.brand h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.7rem;line-height:1;margin:0;font-weight:600}
.brand p{margin:2px 0 0;font-size:.75rem;color:var(--muted)}
.tb{display:flex;gap:8px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.ib svg{width:18px;height:18px}
.em{display:block}
.em .ga{fill:var(--c1)}.em .gb{fill:var(--c2)}.em .gw{fill:#fff;opacity:.45}.em .gk{fill:#0A0C12}
.em .gs{fill:none;stroke:var(--c1);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.em .gt{fill:none;stroke:var(--c2);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.hero{position:relative;text-align:center;padding:4px 0 0;touch-action:pan-y;user-select:none}
.hero .tier{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--c1);border:1px solid color-mix(in srgb,var(--c1) 55%,transparent);padding:3px 12px;border-radius:999px;background:color-mix(in srgb,var(--c1) 12%,transparent)}
.orb{position:relative;width:196px;height:196px;margin:8px auto 4px}
.orb .glow{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c1) 55%,transparent),transparent 68%);filter:blur(10px);opacity:var(--glow);animation:breathe 4s ease-in-out 3}
.orb svg.rings{position:absolute;inset:0;width:100%;height:100%}
.orb .r1{transform-origin:98px 98px;animation:spin 26s linear 3}
.orb .r2{transform-origin:98px 98px;animation:spin 40s linear 3 reverse}
.orb .core{position:absolute;inset:0;display:grid;place-items:center;animation:floaty 6s ease-in-out 3;filter:drop-shadow(0 0 calc(14px*var(--glow)) var(--c1))}
.orb .pingr{position:absolute;inset:18%;border-radius:50%;border:2px solid var(--c1);opacity:0;pointer-events:none}
.orb.ping .pingr{animation:ping 300ms ease-out}
.hero h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:2.3rem;line-height:1;margin:2px 0 4px;font-weight:600}
.hero .bl{margin:0 auto;max-width:42ch;color:var(--muted);font-size:.9rem}
.hero .sts{margin-top:8px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.hero .sts b{color:var(--ink);font-weight:600}
.arrow{position:absolute;top:84px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);display:grid;place-items:center;}
.arrow.l{left:0}.arrow.r{right:0}
.arrow svg{width:18px;height:18px}
.orbs{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.orbs::-webkit-scrollbar{display:none}
.tl{flex:none;writing-mode:vertical-rl;transform:rotate(180deg);font-size:.75rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:0 4px;align-self:center;opacity:.8}
.mini{flex:none;width:56px;background:none;border:0;padding:0;text-align:center;scroll-snap-align:center}
.mini .mo{width:46px;height:46px;margin:0 auto;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);transition:transform 200ms,box-shadow 200ms,border-color 200ms}
.mini span{display:block;font-size:.75rem;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini[aria-current="true"] .mo{border-color:var(--c1);transform:scale(1.14);box-shadow:0 0 calc(18px*var(--glow)) color-mix(in srgb,var(--c1) 70%,transparent)}
.mini[aria-current="true"] span{color:var(--ink);font-weight:600}
.tree{position:relative;margin-top:10px;padding-left:22px}
.tree::before{content:"";position:absolute;left:8px;top:0;bottom:12px;width:2px;background:linear-gradient(var(--c1),color-mix(in srgb,var(--c2) 40%,transparent));opacity:.7;border-radius:2px}
.tree::after{content:"";position:absolute;left:5px;top:0;width:8px;height:40px;border-radius:8px;background:linear-gradient(transparent,var(--c2),transparent);animation:run 3.4s linear 3;opacity:.9}
.grp{position:relative;margin:0 0 12px}
.grp::before{content:"";position:absolute;left:-18px;top:28px;width:18px;height:2px;background:var(--c1);opacity:.7}
.grp::after{content:"";position:absolute;left:-23px;top:23px;width:10px;height:10px;transform:rotate(45deg);background:var(--c1);box-shadow:0 0 10px var(--c1)}
.ch{clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}
.gh{display:block;width:100%;padding:1.5px;border:0;text-align:left;background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c2) 60%,transparent) 55%,var(--c1));transition:transform 150ms,filter 200ms}
.gh:active{transform:scale(.985)}
.gh .in{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel2)}
.gh.sel{filter:drop-shadow(0 0 calc(10px*var(--glow)) var(--c1))}
.gh.has .in{background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 20%,var(--panel2)),var(--panel2))}
.gh.prop{background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 55%,transparent),color-mix(in srgb,var(--c2) 30%,transparent))}
.tile{flex:none;width:44px;height:44px;display:grid;place-items:center;background:color-mix(in srgb,var(--c1) 16%,var(--panel));transform:rotate(0)}
.tile svg{width:30px;height:30px}
.gt{min-width:0;flex:1}
.gt b{display:block;font-size:.98rem;line-height:1.2}
.gt i{display:block;font-style:normal;font-size:.75rem;color:var(--muted);margin-top:2px}
.pill{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.08em;padding:1px 7px;border-radius:999px;margin-right:4px;vertical-align:1px}
.pill.new{background:color-mix(in srgb,var(--c2) 30%,transparent);color:var(--ink);border:1px solid var(--c2)}
.pill.cn{border:1px solid var(--line);color:var(--muted)}
.badge{flex:none;min-width:24px;height:24px;border-radius:12px;padding:0 7px;display:grid;place-items:center;background:var(--c1);color:#0A0C12;font-size:.75rem;font-weight:600}
.chev{flex:none;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.chev svg{width:14px;height:14px;transition:transform 200ms}
.grp.open .chev svg{transform:rotate(180deg)}
.kids{display:none;flex-wrap:wrap;gap:7px;padding:10px 4px 2px 14px;margin-left:16px;border-left:2px dashed color-mix(in srgb,var(--c1) 45%,transparent)}
.grp.open .kids{display:flex;animation:drop 200ms ease-out}
.leaf{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:6px 11px 6px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:.8rem;text-align:left;transition:transform 100ms,border-color 200ms,box-shadow 200ms}
.leaf:active{transform:scale(.96)}
.leaf .gem{flex:none;width:12px;height:12px;transform:rotate(45deg);background:linear-gradient(135deg,var(--c2),var(--c1));border-radius:2px}
.leaf.sel{border-color:var(--c1);box-shadow:0 0 calc(12px*var(--glow)) color-mix(in srgb,var(--c1) 70%,transparent)}
.leaf.has{border-color:color-mix(in srgb,var(--c1) 70%,transparent);background:color-mix(in srgb,var(--c1) 14%,var(--panel))}
.leaf.prop{border-style:dashed}
.leaf .ct{font-size:.75rem;font-weight:600;background:var(--c1);color:#0A0C12;border-radius:8px;padding:0 5px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}
.nav .bar{max-width:420px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);}
.nav button{border:0;background:none;border-radius:13px;padding:10px;font-weight:600;font-size:.9rem;color:var(--muted)}
.nav button[aria-pressed="true"]{background:linear-gradient(135deg,var(--c1),var(--c2));color:#0A0C12}
.back{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:84vh;overflow:auto;padding:14px 16px calc(22px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:var(--panel);border:1px solid var(--line);border-bottom:0;box-shadow:0 -20px 60px rgba(0,0,0,.45);animation:up 300ms cubic-bezier(.2,.9,.3,1);max-width:560px;margin:0 auto}
.sheet .grip{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sh-top{display:flex;gap:14px;align-items:center}
.sh-top .tile{width:62px;height:62px}
.sh-top .tile svg{width:42px;height:42px}
.sh-top h3{font-family:"Cormorant Garamond",serif;font-size:1.65rem;line-height:1.05;margin:0}
.sh-top p{margin:3px 0 0;font-size:.76rem;color:var(--muted)}
.sheet .desc{margin:14px 0 4px;font-size:.95rem}
.sec{margin-top:16px}
.sec h4{margin:0 0 7px;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:.82rem}
.chip.you{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 16%,var(--panel2))}
.chip.canon{border-style:dashed;color:var(--muted)}
.chip button{border:0;background:none;padding:0 0 0 2px;font-size:1rem;line-height:1;color:var(--muted)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:14px;border:1px solid var(--c1);background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 85%,transparent),color-mix(in srgb,var(--c2) 70%,transparent));color:#0A0C12;font-weight:600;font-size:.9rem}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note{font-size:.8rem;color:var(--muted);margin:8px 0 0}
.note.warn{color:var(--ink);border-left:3px solid var(--c1);padding-left:9px}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);}
.mbox{width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px));animation:up 200ms ease-out}
.mbox h3{margin:0 0 10px;font-family:"Cormorant Garamond",serif;font-size:1.5rem}
.inp{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.list{flex:1;overflow:auto;margin:10px 0;display:flex;flex-direction:column;gap:6px;min-height:120px}
.cr{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-align:left;width:100%}
.cr.on{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 18%,var(--panel2))}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-weight:600;color:#0A0C12}
.cr b{display:block;font-size:.9rem;line-height:1.2}
.cr i{display:block;font-style:normal;font-size:.75rem;color:var(--muted)}
.cr .ck{margin-left:auto;font-size:1.1rem;color:var(--c1)}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.fchips::-webkit-scrollbar{display:none}
.fc{flex:none;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:.76rem}
.fc[aria-pressed="true"]{border-color:var(--c1);color:var(--c1);font-weight:600}
label.ck2{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--muted);margin:6px 0 0}
textarea.inp{min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.cgrid{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.cc{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.cc>button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 12px;text-align:left}
.cc .cn{margin-left:auto;font-size:.76rem;color:var(--muted)}
.cc .body{padding:0 12px 12px}
.ab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);margin-top:6px}
.ab .tile{width:34px;height:34px}.ab .tile svg{width:22px;height:22px}
.ab b{font-size:.85rem;display:block;line-height:1.2}.ab i{font-style:normal;font-size:.75rem;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:.9rem}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.92)}50%{transform:scale(1.08)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes ping{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.em .swap .ga{fill:var(--c2)}.em .swap .gb{fill:var(--c1)}.em .swap .gs{stroke:var(--c2)}.em .swap .gt{stroke:var(--c1)}
.em .neon .ga{fill:none;stroke:var(--c1);stroke-width:var(--sw,2.2);stroke-linejoin:round}
.em .neon .gb{fill:none;stroke:var(--c2);stroke-width:var(--sw,2.2);stroke-linejoin:round}
.em .neon .gk{fill:none;stroke:var(--c2);stroke-width:var(--sw,1.4);opacity:.55}
.em .neon .gw{display:none}
.em .neon .gs{stroke-width:var(--sw2,5)}
.em .neon .gt{stroke-width:var(--sw3,3.4)}
.em .sil .ga{fill:#fff;opacity:.97}.em .sil .gb{fill:#fff;opacity:.62}
.em .sil .gk{fill:rgba(8,10,16,.55)}
.em .sil .gw{opacity:0}
.em .sil .gs,.em .sil .gt{stroke:#fff}
.em .mast .ga{fill:#F7F2E4}.em .mast .gb{fill:var(--c2)}.em .mast .gk{fill:rgba(8,10,16,.55)}.em .mast .gs{stroke:#F7F2E4}.em .mast .gt{stroke:var(--c2)}
svg.sty-neon,svg.sty-frame,svg.sty-seal{filter:drop-shadow(0 0 2.5px var(--c1))}
svg.sty-orb,svg.sty-crest{filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.leaf{padding:4px 12px 4px 5px;gap:8px}
.leaf .lem{flex:none;width:24px;height:24px;display:block}
.leaf .lem svg{width:24px;height:24px}
.nav .bar{grid-template-columns:repeat(3,1fr)}
.nav button{font-size:.84rem;padding:10px 4px}
.sty-intro{margin:4px 0 12px;color:var(--muted);font-size:.9rem}
.sty-grid{display:grid;grid-template-columns:1fr;gap:12px}
.stycard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:12px 12px 14px;transition:border-color 200ms,box-shadow 200ms,transform 150ms}
.stycard:active{transform:scale(.99)}
.stycard.on{border-color:var(--c1);box-shadow:0 0 calc(18px*var(--glow)) color-mix(in srgb,var(--c1) 55%,transparent);background:color-mix(in srgb,var(--c1) 8%,var(--panel))}
.stycard .prev{display:flex;gap:10px;justify-content:space-between;padding:12px 8px;border-radius:12px;background:var(--panel2);margin-bottom:10px}
.stycard .prev>div{flex:1;display:grid;place-items:center}
.stycard b{display:flex;align-items:center;gap:8px;font-size:1.02rem}
.stycard i{display:block;font-style:normal;font-size:.8rem;color:var(--muted);margin-top:3px}
.stycard .rf{font-size:.75rem;color:var(--muted);margin-top:6px;opacity:.85}
.stycard .tick{margin-left:auto;font-size:.75rem;font-weight:600;color:#0A0C12;background:var(--c1);border-radius:999px;padding:1px 9px}
.tog{display:flex;align-items:center;gap:12px;margin:14px 0 6px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.tog input{width:20px;height:20px;accent-color:var(--c1)}
.tog b{display:block;font-size:.9rem}.tog i{display:block;font-style:normal;font-size:.76rem;color:var(--muted)}

.xgh{display:block;width:100%;padding:1.5px;border:0;text-align:left;background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c2) 60%,transparent) 55%,var(--c1));transition:transform 150ms,filter 200ms}
.xgh:active{transform:scale(.985)}
.xgh .in{display:flex;align-items:center;gap:11px;padding:9px 11px;background:var(--panel2)}
.xgh:focus-visible{outline:2px solid var(--c1);outline-offset:3px}
.cgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.cgrid2>*{min-width:0}
.cgrid2 .xgh .gt{min-width:0;overflow:hidden}
.cgrid2 .xgh{padding:1.5px}
.cgrid2 .xgh .in{padding:8px 9px;gap:9px}
.cgrid2 .xgh .tile{width:38px;height:38px}
.cgrid2 .xgh .tile svg{width:28px;height:28px}
.cgrid2 .gt b{font-size:.86rem;line-height:1.15}
.cgrid2 .gt i{font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cgrid2 .badge{min-width:20px;height:20px;font-size:.75rem;padding:0 5px}
.sback{position:absolute;left:14px;top:12px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:600;z-index:2}
.sheet{position:fixed}
.nmb{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.gstage{position:relative;border-radius:18px;overflow:hidden;background:color-mix(in srgb,var(--panel) 80%,transparent);border:1px solid var(--line);touch-action:none}
#bsvg{display:block;width:100%;height:540px}
#gWeb{display:block;width:100%}
.ghint{position:absolute;left:10px;bottom:10px;font-size:.75rem;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:4px 10px;border-radius:999px;pointer-events:none}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}

[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:max-content;max-width:min(240px,80vw);white-space:normal;text-align:center;padding:4px 8px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:500;line-height:1.4;pointer-events:none;z-index:70}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* surfaces: slide-over for short edits, named confirmation for destructive actions */
.xscrim[hidden],.slide[hidden],.xcfm[hidden]{display:none}
.xscrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);opacity:0;transition:opacity var(--m150) var(--ease-out)}
.xscrim[data-open="true"]{opacity:1}
.slide{position:fixed;inset-block:0;inset-inline-end:0;z-index:51;width:min(480px,100vw);height:100dvh;display:flex;flex-direction:column;background:var(--panel);border-inline-start:1px solid var(--line);transform:translateX(100%);opacity:0;transition:transform var(--m150) var(--ease-in),opacity var(--m150) var(--ease-in)}
.slide[data-open="true"]{transform:none;opacity:1;transition:transform var(--m200) var(--ease-out),opacity var(--m200) var(--ease-out)}
.slide .mbox{max-width:none;width:100%;height:100%;max-height:none;border:0;border-radius:0;animation:none;display:flex;flex-direction:column;gap:12px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.slide .mbox>.list{flex:1;min-height:0;overflow:auto;margin:0;display:block}
.slide .mbox>.row{position:sticky;bottom:0;background:var(--panel);padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));gap:8px;flex-wrap:wrap}

.cfmb h3{font-size:1.25rem;line-height:1.25;margin:0 0 8px}.cfmb p{margin:0;color:var(--muted)}
.cfmr{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:24px}

/* forms: label above, error under, never a disabled save */
.fld{display:grid;gap:4px;margin:0 0 12px}.fld>span{color:var(--muted);font-weight:500}
.fld .ferr{display:none;color:var(--danger);font-size:.875rem;line-height:1.4}.fld.bad .ferr{display:block}.fld.bad .inp{border-color:var(--danger)}
.sfield{display:grid;gap:4px;flex:1;min-width:160px}.sfield>span{color:var(--muted);font-weight:500}

.inp{min-height:44px}textarea.inp{resize:vertical;font:inherit;font-size:1rem}select.inp{appearance:auto}

.pvw{display:inline-grid;margin:8px 0 0}.hrow{display:flex;align-items:center;gap:8px;margin:0 8px 8px 0}.holdl{display:flex;flex-wrap:wrap}
.xopt{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.xseg{display:inline-flex;flex-wrap:wrap;padding:4px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.xseg button{border:0;border-radius:8px;background:none;color:var(--muted)}.xseg button.on,.xseg button[aria-checked="true"]{background:var(--c1);color:#0A0C12}

/* lists and tables sit in a visible frame with hairlines and a resting affordance */
.lst{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.lst>*{border-bottom:1px solid var(--line)}.lst>*:last-child{border-bottom:0}
.lh{padding:8px 16px;background:var(--panel2);color:var(--muted);font-weight:600;letter-spacing:.04em}

button.lrow:hover{background:var(--panel2)}.lrow .lt{display:grid;min-width:0;flex:1}.lrow .lt b{font-size:1rem;line-height:1.3}.lrow .lt i{font-style:normal;color:var(--muted)}
.lgo{color:var(--muted);font-size:1.5rem;line-height:1;flex:none;width:24px;text-align:center}.lrow .tile{flex:none}.sealedrow{opacity:.6}.dr{flex-wrap:wrap}

/* settings pattern: section nav is a list on wide and a select on narrow */
.adm{display:grid;gap:16px}.snsel{display:grid}.snl{display:none}
@media (min-width:768px){.adm{grid-template-columns:200px minmax(0,1fr)}.snsel{display:none}.snl{display:grid;gap:4px;align-content:start;position:sticky;top:96px}}

/* layout: shell spans the viewport, only the page content is capped */
#view{max-width:var(--vp-wide);margin-inline:auto}
@media (min-width:768px){body{padding-left:92px}.dock{left:0;top:0;bottom:0;transform:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:92px;padding:16px 8px;border-radius:0;border-width:0 1px 0 0;box-shadow:none}.dk{width:72px;transform:none}.dk[aria-current="true"]::after{bottom:auto;left:-8px;width:3px;height:24px}.rib{left:100px;bottom:auto;top:50%;transform:translateY(-50%);flex-direction:column;max-width:none;max-height:80vh;overflow:auto}#view{padding-bottom:40px}}
.fc,.seg button,.chev{min-height:44px}.fc{min-width:44px;display:inline-flex;align-items:center}.seg button{min-width:44px}.chev{width:44px;height:44px;min-width:44px}
input[type=range]{width:100%;height:44px;margin:0;background:transparent;accent-color:var(--c1)}
svg .hit44{fill:transparent;pointer-events:all}

/* the app shell spans the viewport; only page content is capped */
.wrap{max-width:none}
.tree::after{display:none}

/* interactive elements carry the accent */
.xh{color:var(--c1)}.lgo{color:var(--c1)}.lh{color:var(--c1)}.afilt{border-color:var(--c1)}.snl button.on{border-color:var(--c1);color:var(--c1)}
.lrow:hover .lgo{transform:translateX(2px)}
button.lrow:focus-visible,.btn:focus-visible,.xseg button:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.pager .btn:not([aria-disabled="true"]){border-color:var(--c1);color:var(--c1)}

G("Oneirokinesis","Dream dominion: she enters dreams while awake and kills the will without touching the body.",["Asetra"],"Lucid Prison|Traps the mind in an endless dream.;;Dream Collapse|Shatters mental identity.;;Waking Mirage|Brings dream logic into reality."),
G("Psychological Dominion","Her cruelest power: she amplifies the fear, guilt or desire already inside you. It works on any species.",["Asetra"],"Fear Bloom|Expands fear until paralysis.;;Jealous Crown|Turns desire into obsession.;;Possession Thread|Makes targets emotionally enslave themselves.;;Ego Fracture|Shatters self-worth."),
G("Omniscience","She sees every possible future, not just one. Surprise does not work on her.",["Asetra"],"Total Sight|Perceive all timelines.;;Causal Read|Know why something will happen.;;Outcome Lock|Act only when the result is guaranteed."),
G("Nightmare Dominion","Fear-based hallucinations: victims see themselves failing, not monsters.",["Norman"],"Pale Whisper|A subtle nightmare the victim believes is internal.;;Nightfall Choir|Mass fear amplification that causes city-scale panic.",{x:["blood"]}),
G("Nightmare Induction","Selective fear and regret projected through eye contact.",["Arzuna"],"Blue Mirror|Forces the target to relive their worst regret for seconds.;;Silent Howl|A paralytic fear pulse without hallucinations.;;Lament Trace|Leaves emotional residue that weakens enemies over time.",{x:["blood"]}),
G("Memory Manipulation","Claw-triggered: implant false memories, extract trauma or twist events. Used sparingly.",["Norman"]),
G("Vessel Shift","Swap bodies with another person for a limited time; both minds stay intact. Some bodies take training to operate.",[],"Flash Exchange|A very fast swap with a nearby target.;;Last Refuge|Swap with a pre-linked target to escape danger.;;Relay Shift|A rapid chain of swaps with several targets.;;Home Pull|Cancel the swap and return instantly.;;Soul Web|Awakening: a network of linked minds across many targets.;;Hall of Masks|Prime: a synchronized network controlling many bodies at once.",{p:1,sg:"Graye, or the seven families’ elders on the villain side. Counters: Al-Ahd’s unbreakable mind, Aether, Judgement."})]},
{id:"space",nm:"Space",tier:"Laws",c1:"#6C8CFF",c2:"#C7D8FF",bl:"Portals, rifts, folds and the void.",x:["time","arcane","blood"],g:[
G("Dagger Portals","Short-range spatial tears opened by thrown daggers.",["David (Dawood)"],"Laughing Cut|A close-range blink made by throwing a dagger past the enemy and pulling himself to it.;;Silent Step Fang|A clean teleport without theatrics."),
G("Cross-Dimensional Spatial Access","An unstable evolution under the Cube’s influence: portals reach beyond local space.",["David (Dawood)"],"World Scar|A dagger throw that briefly opens a slit between universes."),
G("Dimensional Run","Speed beyond physical space that skims dimensions and distorts time. Every use ages him.",["Weston Hale"],"",{x:["time"]}),
G("Dimension Magic","Rift, fold and anchor magic.",["Damian Brown"],"Dimensional Threading|Precise rift cuts and short-range folds.;;Teleportation Magic|Clean, instant, low-energy jumps.;;Dimensional Anchor|Prevents teleportation, phasing or escape.;;Dimension Awareness|Passive: feels rifts, distortions and spatial instability.",{x:["arcane"]}),
G("Voidcall*","His void first opened by instinct to survive Tedmond. It sends people out of reach.",["Isaac Ezekiel"])]},
{id:"curse",nm:"Curse",tier:"Laws",c1:"#B03CFF",c2:"#EBC4FF",bl:"Intent made permanent.",x:["blood"],g:[
G("Curse Techniques","Curses are intent made permanent. His are planted through blood and spread through bloodlines.",["Khalid"],"Blood Oath Ruin|A curse planted through blood contact.;;Abyss Mark|Victims slowly lose free will, and their fear feeds him.;;Inheritance Curse|Power corruption spreads through bloodlines.;;Crimson Genesis|Turns a human into a vampire-like entity, stripping free will and humanity.",{x:["blood"]})]},
{id:"fire",nm:"Fire",tier:"Primary",c1:"#FF5A2E",c2:"#FFC24A",bl:"Flame, heat and combustion, from raw fire to spirit flame.",x:["judgement","moon","arcane","earth"],g:[
G("Pyrokinesis*","The general flame power: heat, fire and combustion under the user’s will.",["Rowan Colloway"]),
G("Rowan’s Flame","His base fire: flame as punches, bursts and grabs.",["Rowan Colloway"],"Flame Fist|Full-hand ignition; punches hit like detonations.;;Ignis Knuckle|Condensed flame at the point of impact for bone-breaking blows.;;Cinder Rush|A short burst dash using flame recoil.;;Ember Shot|Bullet-speed flame fired from the fingers.;;Scorch Grab|A burning grapple with damage over time."),
G("Red Flame Magic","Rage-fed arcane combustion, not elemental fire. Power spikes violently and the body strains.",["Rowan Colloway"],"Crimson Wrath|Berserk amplification, with a flame avatar behind him.;;Ravage Arc|Wide flame slashes through many targets.;;Infernal Howl|A shockwave roar infused with red flame.;;Pyrochain Lash|A flame-infused chain whip.;;Scorch Bind|The chain wraps and burns from the inside.;;Cinder Snare|Area denial with a spinning heated chain.",{x:["arcane"]}),
G("Duskmoor Flame","The Blue Flame. It is not elemental fire: it burns souls, curses and corruption, and only corrupted souls. It erases instead of exploding.",["Rowan Colloway","Silas Duskmoor","Tedmond Duskmoor"],"Blue Silence|Flame that erases instead of exploding.;;Duskmoor Edge|Precision cuts through anything chaotic.;;Last Chain of Duskmoor|A chain infused with Blue Flame: an execution move.",{x:["judgement","moon"]}),
G("Corruption Separation","She never received the flame. She separates corruption from a person and burns only that, if they truly want to be free.",["Mara Duskmoor"],"",{x:["judgement"]}),
G("Agharri Kit","Fire-clan abilities for a clan that has none recorded yet.",[],"Pyre Zenith|Prime state: the clan’s peak flame.;;Ember Suture|Heals wounds by burning them closed, with a cost.;;Basalt Flow|A molten stone current bridging Fire and Earth.;;Inextinguishable Flame|Fire that cannot be put out.",{p:1,sg:"The Agharri clan, such as Kael Agharri. Niharo’s Omni-Ergon eats fire, so Kael could never hurt the boy he raised."}),
G("Ignis Spells","A 13-spell fire school adapted from the charts.",[],"Pyre Orb|A fire sphere that explodes on impact.;;Blaze Brand|A blade of pure fire that sears defenses.;;Flare Arrow|A condensed fire arrow that ignites its target.;;Searing Stream|A continuous stream of roaring flame.;;Rising Blaze|Wings of flame for flight. Clashes with Amaya being the only winged character.;;Cinder Mantle|A mantle of blazing fire that burns attackers.;;Pyre Pillar|A column of fire from the ground.;;Wildfire Surge|Makes existing fire expand violently.;;Lancing Flame|A high-intensity piercing flame.;;Firefall|A rain of flaming projectiles.;;Phoenix Cleanse|Purifying flames burn away injuries and poisons. Never resurrection.;;Flame Colossus|A giant formed from fire. Not a dragon, since dragons are a species.;;Final Inferno|Domain: a sea of unrelenting flame.",{p:1,sg:"The Agharri clan. Rowan already overlaps, so leave his set alone."})]},
{id:"water",nm:"Water",tier:"Primary",c1:"#3FB6E8",c2:"#BDE8FF",bl:"Flow, pressure, mist and ice.",x:["moon","life"],g:[
G("Hydrokinesis","Controls water’s flow, pressure and state wherever water exists. Stronger near water and with a calm mind.",["Nilanjona"],"Flow Command|Waves, whips and shields.;;Tide Bind|Wraps water around enemies and can drown them.;;Aqua Construct|Solid water spears, barriers and platforms.;;Mist Veil|Dense mist that blocks vision and masks movement.;;Current Step|Fast movement on flowing water, including surface-running.;;Hydroport|Advanced water travel; needs a nearby water source.;;Dehydration Grip|Pulls water out of a body. Lethal if sustained."),
G("Hydro Regeneration","Water accelerates healing, cleans wounds and gradually restores stamina.",["Nilanjona"],"",{x:["life"]}),
G("Cryokinesis","Unlocked as the Water Guardian: instant freezing, ice armor and permanent ice.",["Nilanjona"],"Frost Dominion|Instantly freezes the water she controls and locks enemies mid-motion.;;White Silence|Layered ice around her body that drops temperature, slows enemies and numbs muscles.;;Icebound Construct|Permanent ice weapons and structures."),
G("Tide*","The moon’s pull on water.",[],"",{x:["moon"]}),
G("Nezha Upgrades","Water Guardian additions drawn from the frost school.",[],"Hibernal Sovereign State|Prime: a beacon of cold that freezes a wide area.;;Rimebreak|Detonate your own ice into shards.",{p:1,sg:"Nilanjona as Water Guardian."}),
G("Aquae Spells","A 13-spell water school adapted from the charts.",[],"Torrent Rush|A powerful surge of water.;;Tide Tendrils|Tentacles of water that grasp, bind and crush.;;Cleansing Spring|Sacred water that cleanses and heals.;;Sea Breath|Breathe and move freely underwater.;;Wave Call|Summon waves from nearby water.;;Ripple Ward|A repelling bubble of water.;;Wave Blade|A fluid blade of water.;;Deep Press|A force that drags targets under.;;Surge Dome|A circulating protective dome.;;Siren Call|A melody that enthralls minds.;;Drowning Spiral|A vortex that crushes what it catches.;;Falling Deluge|A cascade of water from above.;;Endless Fount|Domain: boundless, ever-flowing waters.",{p:1,sg:"Nilanjona. Siren Call also suits Maya."})]},
{id:"earth",nm:"Earth",tier:"Primary",c1:"#B98A55",c2:"#F0D9B0",bl:"Stone, ground, matter and metal.",x:["fire"],g:[
G("Earth Awakening","Rowan’s second awakening: earth reinforces his body and reshapes the battlefield.",["Rowan Colloway"],"Stonebound Stand|Earth reinforces his body: an immovable anchor.;;Grave Uplift|The ground erupts to impale or trap enemies.;;Tectonic Guard|An earth shield layered beneath his flame defense.;;Obsidian Path|Reshapes the battlefield for positioning and control.;;Earthfire Convergence|Flame flowing through stone for controlled devastation.",{x:["fire"]}),
G("Atomokinesis","Control of atoms: reshape, disintegrate and rebuild matter.",["Asetra"],"Atomic Sever|Break matter at the atomic level.;;Matter Rewrite|Reshape objects or bodies.;;Null Core|Erase atomic bonds completely."),
G("Magnetokinesis","Control of magnetic matter. An open slot in the SCU.",[],"Arc Discharge|Weapons release bolts of energy.",{p:1,sg:"Open slot, for the Earth tree’s metal and crystal."}),
G("Varun Kit","Earth-clan abilities adapted from the nature chart.",[],"Rooted Stand|Stand rooted to the ground for greater power.;;Greenway|Pass through plant and stone.",{p:1,sg:"The Varun clan."}),
G("Terra Spells","A 13-spell earth school adapted from the charts.",[],"Spire Rise|Earth spines that impale or block.;;Stone Maul|A huge club of condensed stone.;;Faultline|Splits the ground open.;;Titan Lift|Lift and hold vast masses of earth.;;Stonebind|Link stone masses into one formation.;;Stone Lance|A spear of earth.;;Tremor Wave|A seismic wave across the ground.;;Shatterquake|A concussive impact that breaks structures.;;Granite Core|A core of earth energy that strengthens control.;;Breakwall|A defensive wall that fragments attackers.;;Hollow Ground|A chasm that swallows targets.;;Living Stone|Animates terrain into golems.;;Ruin Quake|Domain: a wasteland of shattered earth and endless fissures.",{p:1,sg:"The Varun clan."})]},
{id:"air",nm:"Air",tier:"Primary",c1:"#8EF0DC",c2:"#E3FFF8",bl:"Wind, pressure and weather.",x:["blood","arcane","lightning"],g:[
G("Aerokinesis","Control of air, wind and pressure. The wind responds to calm and spikes with emotion.",["Ethan Thorne"],"Windstep|Wind-assisted movement.;;Gale Guard|A defensive barrier of wind.;;Pressure Break|Internal rupture through compressed pressure.;;Sky Rend|Layered wind blades; the cyclone variant is multi-layered.;;Storm Pull|Draws targets in with wind.;;Eye of Calm|Calm lets the wind obey him.;;Tempest Drive|Wind propulsion for near-untouchable speed assaults.;;Pressure Sense|Awareness of air shifts."),
G("Wind Guardian Mode","Manifests for the first time in the final fight against Isaac.",["Ethan Thorne"]),
G("Wind and Blood Hybrids","Combination executions that merge his wind with Elizah’s blood, not new abilities.",["Ethan Thorne","Elizah"],"Crimson Windstep|Blood-assisted acceleration with faster, sharper turns.;;Sanguine Weave|Blood threads reinforce air barriers.;;Hematic Pulse|Internal rupture through compressed blood-air resonance.;;Crimson Tempest|A wind-blood resonance burst: a finisher.",{x:["blood"]}),
G("Weather Influence","Localized, controlled weather.",["Damian Brown"],"",{x:["arcane"]})]},
{id:"lightning",nm:"Lightning",tier:"Primary",c1:"#FFE14A",c2:"#FFF7B0",bl:"Electricity, red lightning and pure speed.",x:["blood","life","air"],g:[
G("Astrapo-Electrokinesis","Control of the whole electrical phenomenon: charge, discharge, sound and motion.",["Zayn Hayes"],"Volt Bind|Controls electric fields to paralyze, lock muscles or disable tech.;;Astrapo Bolt|A standard lightning strike.;;Thunderclap Drive|Compressed thunder: shockwave, deafening sound and internal damage.;;Ion Step|A short lightning teleport.;;Static Absorption|Absorbs incoming electricity into stamina or power.;;Activation and Deactivation|Switches lights, machines, grids and enemy tech on or off."),
G("Red Lightning","The bloodline’s overcharged lightning: faster than normal lightning, unstable, harder to absorb or redirect. It disrupts blood art. Dorian’s origin.",["Dorian Cross","Zayn Hayes"],"",{x:["blood"]}),
G("Crimson Astrapo","Zayn’s refined prime ability, built on red lightning. Similar, but not the same thing.",["Zayn Hayes"],"Crimson Strike|Red lightning focused into one hit that burns internally and can stop regeneration.;;Red Tempest|A storm of red lightning that boosts speed, strength and reaction. Heavy fatigue.",{x:["blood"]}),
G("White Lightning Drive","Not elemental: bio-electric kinetic speed that stacks momentum. It exists only while he moves.",["Weston Hale"],"Flashstep|Instant directional acceleration.;;Velocity Strike|A punch that lands before the sound, detonating force internally.;;Overdrive Burst|Stored speed released in one explosive dash.;;Kinetic Absorption|Passive: absorbs his own motion energy and part of impacts."),
G("Vorrathi Kit","Sky lightning for a clan with none recorded: atmospheric, unlike El-Mansur’s blood lightning.",[],"Keraunos Bolt|A bolt of sky lightning.;;Storm Sigil|A static trap that shocks whoever triggers it.;;Charge Tether|Drains energy through a link to another being.;;Living Conduit|Turn into lightning to cast.;;Thunderhead State|Prime: a storm-crowned state.",{p:1,sg:"The Vorrathi clan."})]},
{id:"light",nm:"Light",tier:"Primary",c1:"#FFF1A8",c2:"#FFFFFF",bl:"Radiance, golden construction and sanctified movement.",x:["sun","judgement"],g:[
G("Divine Constructs","Golden weapons, barriers and sigils.",["Grace"],"",{x:["judgement","sun"]}),
G("Sanctified Mobility","Short-range divine movement, like light folding.",["Grace"],"",{x:["judgement"]})]},
{id:"shadow",nm:"Shadow",tier:"Primary",c1:"#7A5CD8",c2:"#BBA6FF",bl:"Shadow, concealment and spirit forms.",x:["moon","blood","arcane"],g:[
G("Umbrakinesis","Demonic control of darkness: animate shadows, absorb light and become darkness.",["Khalid"],"Black Throne|Area-wide light suppression.;;Shadow Maw|Darkness that consumes matter.;;Umbral Merge|His body becomes shadow, untouchable by normal means.",{x:["blood"]}),
G("Revenant Shadow*","Shadow-fluid manipulation tied to her emotional bonds.",["Arzuna"],"Nocturne Veil|Shadow wraps her body, reducing damage and masking her presence.;;Gloom Step|Short-range shadow displacement, not teleportation.;;Black Wake|A shadow surge that knocks enemies back in a wave.",{x:["blood"]}),
G("Dark Arcana","Bound shadow: seals and suppression fields.",["Damian Brown"],"",{x:["arcane"]}),
G("Concealment Magic","Invisibility and presence erasure.",["Damian Brown"],"",{x:["arcane"]}),
G("Shadow Spirit Forms","Ten forms of darkness given shape, adapted from the charts.",[],"Gloom Wraith|Haunting, intangible, fear.;;Smoke Shade|Adaptive, elusive, transformation.;;Night Fang|Strength, instinct, destruction.;;Omen Raven|Knowledge, observation, omens.;;Whisper Serpent|Manipulation, deception, renewal.;;Veil Phantom|Illusion, possession, confusion.;;Shard Mirror|Reflection, duplication, trickery.;;Dread Shade|Terror, madness, reality warp. Asetra’s territory, so give it to no one else.;;Hollow Shade|Absorption and oblivion. Cap it at light and energy so it never rivals Aether.;;Umbral Sovereign|Dominion, transcendence, eternal existence. The shadow lord form.",{p:1,sg:"Khalid and Arzuna, with Omen Raven for the Vethara prophets."})]},
{id:"life",nm:"Life",tier:"Primary",c1:"#6BD96B",c2:"#C8F5B8",bl:"Healing, growth and nature.",x:["sun","judgement","water","beast"],g:[
G("Restoration*","General healing paired with close combat.",["Maliha"]),
G("Nature Dominion*","The Nature Guardian’s command over plants and living nature.",["Nytheris"]),
G("Nature Guardian Kit","Verdant powers for the Nature Guardian and her student, building on Verdant Sphere.",[],"Verdant Weave|Plants and vines grow and bind at command.;;Verdant Mend|Absorb plant matter to heal.;;Nectar Bloom|A flower that heals.;;Warden Motes|Spirit wards that absorb incoming spells.;;Grove Wardens|Summoned nature elementals.;;Elder Verdant State|Prime: a colossal form of living nature.",{p:1,sg:"Nytheris and Amaya."}),
G("Natura Spells","A 13-spell nature school adapted from the charts.",[],"Vine Bind|Vines that bind targets.;;Rootburst|Roots erupt and impale.;;Thornfield|A field of enchanted thorns.;;Rapid Bloom|Accelerates plant growth.;;Grove Rise|Summons a forest across the terrain.;;Barkskin|A layer of hardened bark.;;Life Seed|A seed that grows into a purifying plant.;;Green Mend|Verdant regeneration.;;Hunger Vines|Aggressive vines that drag targets into the earth.;;Wild Skin|A temporary beast form. Overlaps Wildshape, so keep it weak.;;Greenheart|Connect with nearby nature and command its growth.;;Thorn Tempest|A storm of leaves and thorns.;;Overgrowth Realm|Domain: the region becomes a living kingdom of nature.",{p:1,sg:"Nytheris."}),
G("Mateo’s Growth","Body growth turned outward. It would be an Ichor expression, so it sits outside the natural trees.",[],"Osseous Mantle|Armor grown from his own body that regenerates and adapts.;;Bone Edge|Weapons grown from bone, flexible but strong as steel.",{p:1,sg:"Mateo Cruz."}),
G("Vitae Arts","Life-force necromancy. Life force, not soul, so it never overlaps Aether or Judgement.",[],"Vitae Drain|Drains life force from a target.;;Bound Revenant|Raises a corpse as a servant powered by life force.;;Pall of Decay|A rite that rots all life nearby.",{p:1,sg:"Old Order only, never a hero. Keep it implied, not graphic."})]},
{id:"beast",nm:"Beast",tier:"Primary",c1:"#E0A040",c2:"#FFE0A0",bl:"Animal, dragon and shapeshifting powers. A branch of Life.",x:["life","lightning"],g:[
G("Bestiakinesis","Communicate with animals, control their instincts and transform into them.",["Aariz Maddox"],"Wildshape|Transform into any natural animal and gain its traits.;;Beast Communion|Mental communication with animals: calm, guide and call them.;;Mimic Form|Copy a mythical beast’s form, weaker and unstable unless he has defeated it.;;Conquest Form|Full power of a mythical beast he has defeated in the Beast Realm.;;Alpha Break|Last-resort state: stacked instincts, feral, with loss of control."),
G("Hyperkinesis","Always-on heightened senses and awareness.",["Aariz Maddox"],"Predator Sense|Detects movement, heartbeats and intent."),
G("Dragon Physiology","A pure dragon body: monstrous strength, scale durability and fast regeneration.",["Arthur","Freya","Gabriel"],"Dragon Blood Energy|Reinforces strikes and creates shockwave impacts.;;Dragonskin Armor|Adaptive armor that reacts to attacks.;;Predatory Phase|Minimal-energy, brutal hand-to-hand combat.;;Wrath Surge|Dragon force mixed with volatile red lightning.;;Draconic Cataclysm Form|True dragon ascension with extinction-level force.",{x:["lightning"]}),
G("Prismorph","Real-time adaptive shapeshifting from demon and dragon blood. Speed over force.",["Pristine"],"Razor Waltz|Near-invisible cuts at joints, arteries and spell anchors.;;Bloodstep Mirage|False after-images that confuse targeting and magic locks.;;Drakeshred|Dragon-muscle claw strikes that tear through enchanted armor.;;Infernal Veil|Hides her presence from divine and arcane detection.;;Cataclysm Pirouette|Twin Ascension: an airborne execution spiral.;;Sovereign’s Howl|Twin Ascension: a dragon-demonic roar that shatters morale."),
G("Vampiric Shapeshifting","Partial transformations of hands, eyes and fangs. Eye color shows his state.",["Norman"]),
G("Partial Beast Manifestation","An early awakening side effect, before the suit stabilized his power.",["Weston Hale"]),
G("Spirit Kinship","Bond with a divine beast that grows into a sovereign kin.",[],"Sovereign Kin|The bonded beast grows into a spirit that can fight.;;Wild Summons|Call allied beasts and nature spirits.",{p:1,sg:"Orion, who was recruited from a circus."})]},
{id:"venom",nm:"Venom",tier:"Primary",c1:"#A8E040",c2:"#E5FFA0",bl:"Poison, acid and venom. A branch of Life.",x:["life"],g:[
G("Acidic Poison Manipulation","Generate, shape and control acidic poison in several states. Calculated and intentional.",["Amaya"],"Corrosive Mist|Melts weapons, armor and terrain.;;Liquid Poison Streams|Precision attacks.;;Toxic Vapor|Area denial and suffocation.;;Controlled Acidity|Can wound without killing.;;Verdant Sphere|A rotating toxic dome that traps enemies; taught by the Nature Guardian.;;Nature-Bound Manifestation|Poison that moves like a living force and follows intent."),
G("Winged Flight","Natural biological wings. The only winged character in the SCU.",["Amaya"]),
G("Snake Venoms","The snake houses’ venom families.",SNK,"Neurotoxic Venom|Paralyzes instead of destroying.;;Cytotoxic Venom|Destroys tissue.;;Hemotoxic Venom|Turns the victim’s own blood against them.;;Viper Sense|A heat sense that reads what every being desires."),
G("Venenum Spells","A 13-spell poison school adapted from the charts.",[],"Venom Dart|A venom-infused projectile.;;Plague Haze|A toxic mist.;;Viper Fangs|Venom on claws and weapons.;;Creeping Blight|A progressive toxin that spreads.;;Venom Hollow|A zone saturated with toxic force.;;Toxin Blood|Blood that poisons on contact.;;Dead Fog|A suffocating miasma that lingers.;;Acid Bane|Corrodes flesh, materials and barriers.;;Venom Coil|Venomous tendrils that restrain.;;Plague Bloom|A spreading plague over an area.;;Venom Breath|A stream of poisonous vapor.;;Rotting Touch|A deep corruption that spreads to connected targets.;;Eternal Venom|Domain: land, air and water saturated with poison.",{p:1,sg:"The snake houses and Amaya."})]},
{id:"blood",nm:"Blood",tier:"Primary",c1:"#E0263A",c2:"#FF9AA6",bl:"Blood as weapon, fuel, armor and memory.",x:["space","lightning","shadow","air","mind","curse"],g:[
G("Hemokinesis","Complete control of blood as fuel, weapon, armor and memory. More lethal than wind, less absolute than Aether.",["Elizah"],"Crimson Forge|Shapes blood into blades, spikes and claws that harden instantly.;;Blood Pressure Lock|Controls blood flow inside enemies: freeze, knock out or rupture vessels.;;Hemokinetic Combat|Infuses blood into muscles for strength, speed and reflexes.;;Red Regeneration|Rapidly repairs damage at a cost of stamina and focus.;;Blood Cloning|Short-lived copies that look real, hit real and die fast.;;Sanguine Step|Blood propulsion for sudden direction changes and mid-air dodges.;;Blood Mimicry|Adapts his blood to resist heat, cold and toxins. Cannot copy abilities.;;Pain Ignorance|Mental override, not regeneration.;;Crimson Dominion|Last-resort state: blood leaves circulation and forms flowing armor. Severe exhaustion."),
G("Sanguine Shift","Teleportation through his own blood anchors; he breaks down into blood and reforms. Zaan’s version was more like fleeing through blood.",["Elizah","Zaan al-Murad"],"",{x:["space"]}),
G("Abyssal Blood Dominion","Living, hungry blood that corrupts everything it touches. It overwhelms instead of calculating.",["Khalid"],"Crimson Desecration|Blood that rots flesh and spirit.;;Blood Maw|Blood forms devouring entities.;;Abyss Veins|Infects enemy bloodstreams and spreads corruption.;;Abyssal Sovereign State|Blood becomes fully sentient. No exhaustion, no restraint."),
G("Blood Magic","Blood fuels spells and boosts output, and can bind and extend life. Only partly revealed; the user refuses to use it.",["Nur"]),
G("Blood Resonance Assimilation","Her vampirism keeps echoes of the gifts of people she bonds with, and preserves memory instead of eroding it.",["Arzuna"],"Azure Impact|A condensed blue-black burst that sends enemies flying.;;Bloodbound Resolve|An overclock when protecting someone she is anchored to.;;Lament Bite|A controlled bite that ends instead of infecting.;;Azure Revenant State|Her prime: cold blue eyes, control instead of hunger."),
G("Blood Regeneration","Regeneration through blood and revival through science.",["Zaan al-Murad"]),
G("Vampirism","The Paleborn curse: strength, speed, regeneration and predator senses.",["Norman"],"Crimson Marionette|Bitten victims obey instinctively with no free will.;;Eternal Hunger|Emergency feral-calm regeneration, with severe mental cost."),
G("Sanguinis Spells","A 13-spell blood school adapted from the charts.",[],"Scarlet Orb|A blood orb that pierces, explodes or drains.;;Blood Vow|A binding pact sealed in blood.;;Red Shackles|Living blood chains that drain.;;Blood Ward|Preserves blood and delays death.;;Clot Seal|Seals or reopens wounds.;;Bloodmoon Scythe|A blood sickle that cuts and drains.;;Clot Wall|A barrier of coagulated blood that reflects damage.;;Vein Drain|Steals vitality, strength and memories.;;Blood Gift|Transfers blood or life force.;;Blood Servants|Blood shaped into temporary constructs. Renamed so it never clashes with Elizah’s Blood Constructs.;;Vein Command|Controls another person’s blood and actions.;;Vein Surge|Boosts strength and endurance through the veins.;;Crimson Cathedral|Domain: a realm of living blood. Old Order or Khalid only.",{p:1,sg:"Elizah, Khalid, Nur and Zaan. Crimson Cathedral for the Old Order."})]},
{id:"arcane",nm:"Arcane",tier:"Primary",c1:"#4FA8FF",c2:"#C5DEFF",bl:"Learned magic, pacts and black magic. Black magic is not the same as darkness.",x:["fire","time","space","air","shadow"],g:[
G("Aldercrest Core Magic","The learned foundation: four magics that come instinctively.",["Damian Brown","Eldrich Aldercrest"],"Elemental Magic|Controlled and efficient, never flashy.;;Manipulation Magic|Force redirection and object control.;;Illusion Magic|Tactical misdirection, not deception for vanity.;;Dark Magic Controlled|A tool, never indulged."),
G("Aldercrest Precision Magic","Precision and control disciplines.",["Damian Brown"],"Elemental Convergence|Layered elements instead of raw blasts.;;Geometrical Magic|Runes, sigils and spatial locks.;;Analytical Magic|Dissects spells mid-fight.;;Alchemical Transmutation|Battlefield utility only.;;Dream Manipulation Defensive|Denies mental intrusion.;;Memory Magic|Lock, protect or seal memories. Limited.;;Assembly Magic|Creates tools mid-combat."),
G("Aldercrest Signature Spells","Named signature spells.",["Damian Brown"],"Zero Field|Aldercrest Seal: neutralizes uncontrolled magic in an area and turns chaos-based fighters powerless.;;Critical Path Invocation|Calculates the single most efficient spell to end a fight.;;Still Mind Doctrine|An emotional suppression spell layered into consciousness."),
G("Witch Arts","Witch magic. Iqaris was one of the few demons to master it.",["Iqaris"]),
G("Contract Binding*","Deals that bind. He never lies; he chooses which truths to tell.",["Mephisto"]),

/* ================= carousel HUD (spinning ring layout for abilities) ================= */
if(typeof S.hud!=="boolean")S.hud=false;if(typeof S.hudb!=="number")S.hudb=-1;if(typeof S.hudg!=="number")S.hudg=0;

let HD=null;const TAU=Math.PI*2,TOP=-Math.PI/2;
const nrm=a=>{a=(a+Math.PI)%TAU;if(a<0)a+=TAU;return a-Math.PI;};
const put=(el,x,y,s,o)=>{el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s.toFixed(3)})`;if(o!==undefined)el.style.opacity=o;};
const gvars=g=>g&&g.gc?`--c1:${g.gc[0]};--c2:${g.gc[1]}`:"";
function mkNode(inner,label,vars,size,cls,key){const d=document.createElement("button");d.className="hn "+(cls||"");d.setAttribute("style",`${vars};width:${size}px;height:${size}px;margin:${-size/2}px 0 0 ${-size/2}px`);d.setAttribute("aria-label",label);d.innerHTML=`<span class="hb">${inner}</span><span class="hl">${esc(label)}</span>`;if(key)d.dataset.k=key;return d;}
function layRing(ring){const{cx,cy,W,H}=HD;ring.nodes.forEach(n=>{const a=n.base+ring.rot;const x=cx+ring.R*Math.cos(a),y=cy+ring.R*Math.sin(a);const t=Math.max(0,1-Math.abs(nrm(a-TOP))/.62);n.a=a;n.pos={x,y};const on=x>-20&&x<W+20&&y>-20&&y<H+20;put(n.el,x,y,1+.28*t,n.live===false?0:1);n.el.lastChild.style.opacity=on?(n.live===false?0:1):0;});}
const layAll=()=>HD.rings.forEach(layRing);
const deco=(radii,spokes)=>{const{W,H,cx,cy}=HD;let s=`<svg class="hdeco" width="${W}" height="${H}" aria-hidden="true">`;const R=Math.max(...radii)+34;for(let k=0;k<spokes;k++){const a=k*TAU/spokes;s+=`<line x1="${cx+60*Math.cos(a)}" y1="${cy+60*Math.sin(a)}" x2="${cx+R*Math.cos(a)}" y2="${cy+R*Math.sin(a)}" stroke="var(--c1)" stroke-opacity=".16" stroke-width="1"/>`;}
 radii.forEach((r,i)=>{s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--c1)" stroke-opacity="${i%2?".32":".42"}" stroke-width="${i%2?1:1.4}"${i%2?' stroke-dasharray="2 7"':""}/><path d="M${cx-5} ${cy-r-13} L${cx+5} ${cy-r-13} L${cx} ${cy-r-6}Z" fill="var(--c2)" opacity=".85"/>`;});return s+"</svg>";};
const coreHTML=br=>`<div class="orb"><div class="glow"></div><svg class="rings" viewBox="0 0 196 196" aria-hidden="true"><g class="r1"><circle cx="98" cy="98" r="92" fill="none" stroke="${br.c1}" stroke-width="1.5" stroke-dasharray="3 9" opacity=".7"/><path d="M98 2 L104 14 L92 14Z M98 194 L104 182 L92 182Z M2 98 L14 92 L14 104Z M194 98 L182 92 L182 104Z" fill="${br.c1}"/></g><g class="r2"><circle cx="98" cy="98" r="80" fill="none" stroke="${br.c2}" stroke-width="1" opacity=".55"/></g></svg><div class="core">${em(br.id,86)}</div></div><div class="hcn">${esc(br.nm)}</div>`;

 HD.hub=defs.map(([tiers,R],ri)=>{const items=BR.map((b,i)=>({b,i})).filter(o=>tiers.includes(o.b.tier));const nodes=items.map((o,j)=>{const n=mkNode(em(o.b.id,Math.round(30*f)),o.b.nm,cv(o.b),Math.round(46*f),"br");n.dataset.bi=o.i;L.appendChild(n);return{el:n,bi:o.i,base:TOP+(j+[0,.5,.25][ri])*TAU/items.length};});return{nodes,R:R*f,rot:HD.hrot[ri]||0,kind:"b"};});

function secBuild(bi,gsel){const br=BR[bi];const L=$("secL");const{cx,cy,f}=HD;const R1=130*f,R2=218*f;L.setAttribute("style",cv(br));

function leavesBuild(gi,anim){const L=$("secL");const{cx,cy,f}=HD;const bi=HD.b,gr=BR[bi].g[gi];
 (HD.leafNodes||[]).forEach(n=>{n.live=false;put(n.el,cx,cy,.2,0);setTimeout(()=>n.el.remove(),420);});HD.leafNodes=[];HD.rings=HD.rings.slice(0,1);

 if(x=t.closest("[data-bdedit]")){const d=draftsAll().find(z=>z.id===x.dataset.bdedit);if(d){bd=Object.assign(blank(),d,{holders:d.holders.slice()});S.bdraft=bd;save();render();window.scrollTo(0,0);}return;}

  return`<div class="dq" data-q="${q.id}"><b>${esc(q.title)}</b><p>${esc(q.detail)}</p>${idx>=0&&S.pos!=null&&idx>S.pos?`<p class="note">Sealed for readers until “${esc(EV[idx].t)}”.</p>`:""}<div class="chips" role="group" aria-label="Status">${["open","decided","hinted","revealed"].map(k=>`<button class="chip${cur.s===k?" you":""}" data-qs="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div>${isAdm()?`<label class="fld"><span>Hidden until this event (optional)</span><select class="inp" data-qat="${q.id}"><option value="">Always visible</option>${EV.map(e=>`<option value="${esc(e._k)}"${at===e._k?" selected":""}>${esc(e.y+" · "+clipS(e.t,40))}</option>`).join("")}</select></label>`:""}<label class="fld"><span>Your note (optional)</span><textarea class="inp" rows="2">${esc(cur.n)}</textarea></label></div>`;}).join("");}

// dense graph nodes get an invisible hit area of at least 44 screen pixels
function fitHit(){document.querySelectorAll('svg g[role="button"]').forEach(g=>{try{const m=g.getScreenCTM();if(!m)return;const k=Math.hypot(m.a,m.b)||1;let c=g.querySelector(":scope>circle.hit44");if(!c){c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("class","hit44");g.insertBefore(c,g.firstChild);}c.setAttribute("r","0");const bb=g.getBBox();c.setAttribute("cx",bb.x+bb.width/2);c.setAttribute("cy",bb.y+bb.height/2);c.setAttribute("r",Math.max(22/k,Math.max(bb.width,bb.height)/2));}catch(e){}});}
const _render6=render;render=function(){_render6();setTimeout(fitHit,80);};
